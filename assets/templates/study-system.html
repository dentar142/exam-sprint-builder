<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>复习系统 · Study System</title>
<script>
/* anti-flash: set theme before first paint (shared key) */
(function(){try{var t=localStorage.getItem('esb-theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
/* ===== 素雅温暖 — cream / warm-brown / terracotta ===== */
:root,[data-theme="light"]{
  --bg:#F4F0E6;--paper:#FBF8F1;--paper-2:#F3EDE0;--ink:#3A332B;--ink-soft:#6E6357;--ink-faint:#9C9080;
  --line:#E3D9C7;--line-soft:#EEE7D8;--accent:#B5523A;--accent-soft:#C8714F;--accent-bg:#F4E2D8;
  --brown:#8A6D4F;--gold:#B98A2E;--ok:#5C7A4A;--ok-bg:#E8EEDD;
  --code-bg:#F1EADb;--shadow:0 1px 2px rgba(58,40,22,.06),0 6px 22px -12px rgba(58,40,22,.18);
}
[data-theme="dark"]{
  --bg:#1F1B16;--paper:#28231D;--paper-2:#2F2922;--ink:#ECE4D6;--ink-soft:#B7AB97;--ink-faint:#857A69;
  --line:#3B342B;--line-soft:#342E26;--accent:#E08763;--accent-soft:#C8714F;--accent-bg:#3A2A22;
  --brown:#C2A079;--gold:#D7AE54;--ok:#9CB57F;--ok-bg:#2A3122;
  --code-bg:#322B22;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:16px;line-height:1.75;transition:background .3s,color .3s}
.serif{font-family:Georgia,"Songti SC","Source Han Serif SC","Noto Serif CJK SC","Times New Roman",serif}
/* layout */
.layout{display:flex;max-width:1180px;margin:0 auto;min-height:100vh}
.sidebar{flex:0 0 268px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  background:var(--paper);border-right:1px solid var(--line);padding:24px 18px 40px;scrollbar-width:thin}
.brand{font-family:Georgia,"Songti SC",serif;font-size:1.35rem;font-weight:700;letter-spacing:.3px;
  color:var(--ink);margin:4px 6px 4px;line-height:1.3}
.brand .ac{color:var(--accent);font-style:italic}
.subtitle{font-size:.8rem;color:var(--ink-faint);margin:0 6px 20px;letter-spacing:.4px}
.toc{list-style:none;margin:0;padding:0}
.toc li{margin:1px 0}
.toc a{display:block;text-decoration:none;color:var(--ink-soft);font-size:.92rem;padding:8px 12px;
  border-radius:9px;border-left:3px solid transparent;transition:.18s;position:relative}
.toc a:hover{background:var(--paper-2);color:var(--ink)}
.toc a.active{background:var(--accent-bg);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.toc a.lv3{padding-left:26px;font-size:.85rem}
.sb-foot{margin-top:24px;padding-top:16px;border-top:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}
.tg{flex:1;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);border-radius:10px;
  padding:9px 10px;font-size:.82rem;cursor:pointer;font-family:inherit;transition:.15s;text-align:center}
.tg:hover{border-color:var(--accent);color:var(--accent)}
/* main */
.main{flex:1;min-width:0;padding:38px clamp(20px,5vw,64px) 100px}
.kicker{display:inline-block;font-size:.74rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin-bottom:8px}
.page-title{font-family:Georgia,"Songti SC",serif;font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.15;
  margin:0 0 8px;font-weight:700}
.lede{font-size:1.05rem;color:var(--ink-soft);margin:0 0 30px;max-width:62ch}
.content{max-width:820px}
.content section{margin:0 0 46px;scroll-margin-top:24px}
.content h2{font-family:Georgia,"Songti SC",serif;font-size:1.55rem;margin:0 0 4px;padding-bottom:10px;
  border-bottom:2px solid var(--line);position:relative}
.content h2::after{content:"";position:absolute;left:0;bottom:-2px;width:52px;height:2px;background:var(--accent)}
.content h3{font-size:1.12rem;margin:26px 0 8px;color:var(--ink)}
.content p{margin:12px 0}
.content a{color:var(--accent)}
.content ul,.content ol{padding-left:22px;margin:12px 0}
.content li{margin:5px 0}
/* concept card */
.card,.note-card,.concept{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:18px 22px;margin:18px 0;box-shadow:var(--shadow)}
.card>h3:first-child,.concept>h3:first-child{margin-top:2px}
.tag{display:inline-block;background:var(--accent-bg);color:var(--accent);font-size:.72rem;font-weight:700;
  padding:3px 11px;border-radius:999px;letter-spacing:.3px;margin-bottom:6px}
.tip,.warn,.key{border-radius:12px;padding:13px 16px 13px 18px;margin:16px 0;border-left:4px solid var(--brown);
  background:var(--paper-2);font-size:.95rem}
.tip{border-left-color:var(--ok);background:var(--ok-bg)}
.warn{border-left-color:var(--accent);background:var(--accent-bg)}
.key{border-left-color:var(--gold)}
.tip b,.warn b,.key b{display:block;margin-bottom:3px;font-size:.84rem;letter-spacing:.4px;text-transform:uppercase}
/* quick-reference table */
.qref,table{width:100%;border-collapse:collapse;margin:18px 0;font-size:.93rem;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qref caption,table caption{text-align:left;font-weight:700;color:var(--accent);padding:10px 14px 2px;
  font-size:.86rem;letter-spacing:.4px;text-transform:uppercase}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
thead th{background:var(--paper-2);color:var(--ink);font-weight:700;border-bottom:2px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--paper-2)}
code,kbd{font-family:"Cascadia Code","Consolas","Roboto Mono",monospace;font-size:.88em;
  background:var(--code-bg);padding:.1em .45em;border-radius:5px;color:var(--accent)}
kbd{border:1px solid var(--line);box-shadow:0 1px 0 var(--line);color:var(--ink)}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:15px 18px;overflow:auto;
  font-family:"Cascadia Code","Consolas",monospace;font-size:.86rem;line-height:1.6}
pre code{background:none;padding:0;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:18px 0}
/* mobile bar */
.mbar{display:none;position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);
  padding:10px 16px;align-items:center;gap:10px}
.mbar .mtitle{flex:1;font-family:Georgia,serif;font-weight:700}
.iconbtn{border:1px solid var(--line);background:var(--paper-2);color:var(--ink);width:38px;height:38px;
  border-radius:10px;cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
.scrim{display:none}
@media(max-width:840px){
  .mbar{display:flex}
  .sidebar{position:fixed;top:0;left:0;z-index:40;height:100vh;transform:translateX(-100%);transition:transform .25s;
    box-shadow:0 0 40px rgba(0,0,0,.25)}
  .sidebar.open{transform:translateX(0)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;opacity:0;pointer-events:none;transition:.25s}
  .scrim.open{opacity:1;pointer-events:auto}
  .main{padding:24px 20px 90px}
}
</style>
</head>
<body>
<div class="mbar">
  <button class="iconbtn" id="menuBtn" title="目录">&#9776;</button>
  <span class="mtitle">复习系统</span>
  <button class="iconbtn" id="themeBtnM" title="主题">&#127769;</button>
</div>
<div class="scrim" id="scrim"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand serif">复习<span class="ac">系统</span></div>
    <div class="subtitle">STUDY SYSTEM · 考点速览</div>
    <nav><ul class="toc" id="toc"></ul></nav>
    <div class="sb-foot">
      <button class="tg" id="themeBtn">&#127769; 主题</button>
      <button class="tg" id="topBtn">&#8593; 顶部</button>
    </div>
  </aside>

  <main class="main">
    <span class="kicker">EXAM SPRINT</span>
    <h1 class="page-title serif">考点复习系统</h1>
    <p class="lede">左侧目录随阅读自动高亮。下面是注入内容的占位演示——构建脚本会把真实讲义替换进来。</p>
    <div class="content" id="content">
<!--__CONTENT__-->
    </div>
  </main>
</div>

<script>
const THEME_KEY='esb-theme';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

/* ===== Demo content when bank/content is empty ===== */
function demoContent(){
  return [
'<section id="sec-overview"><h2 class="serif">示例 · 概念卡片</h2>',
'<p class="lede" style="margin:6px 0 18px">内容占位为空时显示此演示。把讲义 HTML 注入 <code>&lt;!--__CONTENT__--&gt;</code> 即可。</p>',
'<div class="concept"><span class="tag">核心概念</span><h3>概念卡片 Concept Card</h3>',
'<p>用于承载一个知识点的定义、要点与例子。支持 <code>行内代码</code>、<b>强调</b> 与列表：</p>',
'<ul><li>要点一：简明扼要</li><li>要点二：附带一个例子</li><li>要点三：易错提醒</li></ul></div>',
'<div class="tip"><b>记忆提示</b>右栏目录会随滚动高亮当前章节，点击可平滑跳转。</div>',
'<div class="warn"><b>易错警示</b>注入内容时，请给每个 <code>&lt;section&gt;</code> 一个 <code>id</code> 与一个 <code>&lt;h2&gt;</code> 标题，目录会自动生成。</div>',
'</section>',
'<section id="sec-table"><h2 class="serif">示例 · 速查表</h2>',
'<table class="qref"><caption>Quick Reference</caption>',
'<thead><tr><th>项目</th><th>说明</th><th>取值 / 示例</th></tr></thead><tbody>',
'<tr><td>主题键</td><td>明暗主题共享的 localStorage 键</td><td><code>esb-theme</code></td></tr>',
'<tr><td>内容占位</td><td>注入讲义的位置</td><td><code>&lt;!--__CONTENT__--&gt;</code></td></tr>',
'<tr><td>目录</td><td>由各 section 标题自动生成</td><td>滚动高亮 + 点击跳转</td></tr>',
'</tbody></table>',
'<div class="key"><b>小结</b>这是一个素雅温暖风格的离线复习外壳：左侧章节导航 + 概念卡片 + 速查表，支持明暗双主题。</div>',
'</section>'
  ].join('');
}

/* ===== Build TOC from sections + scrollspy ===== */
function slug(i){return 'sec-'+(i+1);}
function buildTOC(){
  const content=$('#content');
  const secs=$$('#content > section');
  const toc=$('#toc');toc.innerHTML='';
  if(!secs.length){toc.innerHTML='<li><a class="active">（无目录）</a></li>';return;}
  secs.forEach((sec,i)=>{
    if(!sec.id)sec.id=slug(i);
    const h2=sec.querySelector('h2');
    const title=h2?h2.textContent.trim():('第 '+(i+1)+' 节');
    const li=document.createElement('li');
    li.innerHTML='<a href="#'+sec.id+'" data-target="'+sec.id+'">'+title+'</a>';
    toc.appendChild(li);
    // sub-headings (h3) as level-3 entries
    sec.querySelectorAll('h3').forEach((h3,j)=>{
      if(!h3.id)h3.id=sec.id+'-h'+j;
      const sli=document.createElement('li');
      sli.innerHTML='<a class="lv3" href="#'+h3.id+'" data-target="'+h3.id+'">'+h3.textContent.trim()+'</a>';
      toc.appendChild(sli);
    });
  });
  // smooth scroll + close mobile drawer
  $$('#toc a[data-target]').forEach(a=>a.onclick=e=>{
    e.preventDefault();const el=document.getElementById(a.dataset.target);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    closeDrawer();
  });
  scrollspy();
}
function scrollspy(){
  const targets=$$('#content section[id], #content h3[id]');
  const links={};$$('#toc a[data-target]').forEach(a=>links[a.dataset.target]=a);
  if(!('IntersectionObserver' in window)){return;}
  const seen=new Map();
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(en=>seen.set(en.target.id,en));
    let best=null;
    seen.forEach(en=>{if(en.isIntersecting){if(!best||en.boundingClientRect.top<best.boundingClientRect.top)best=en;}});
    if(best){$$('#toc a.active').forEach(a=>a.classList.remove('active'));
      const l=links[best.target.id];if(l)l.classList.add('active');}
  },{rootMargin:'-10% 0px -75% 0px',threshold:0});
  targets.forEach(t=>obs.observe(t));
}

/* ===== Drawer (mobile) ===== */
function openDrawer(){$('#sidebar').classList.add('open');$('#scrim').classList.add('open');}
function closeDrawer(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');}
$('#menuBtn').onclick=openDrawer;$('#scrim').onclick=closeDrawer;

/* ===== Theme ===== */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);
  const lbl=t==='dark'?'☀️ 主题':'\u{1F319} 主题';$('#themeBtn').innerHTML=lbl;
  $('#themeBtnM').innerHTML=t==='dark'?'☀️':'\u{1F319}';try{localStorage.setItem(THEME_KEY,t);}catch(e){}}
function toggleTheme(){applyTheme((document.documentElement.getAttribute('data-theme')||'light')==='dark'?'light':'dark');}
$('#themeBtn').onclick=toggleTheme;$('#themeBtnM').onclick=toggleTheme;
$('#topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

/* ===== Boot ===== */
(function(){
  const content=$('#content');
  if(content.children.length===0){content.innerHTML=demoContent();}
  buildTOC();
  applyTheme(document.documentElement.getAttribute('data-theme')||'light');
})();
</script>
</body>
</html>
