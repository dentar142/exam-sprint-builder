<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考点小抄 · A4 Cheat Sheet</title>
<script>
/* anti-flash: set theme before first paint (shared key) */
(function(){try{var t=localStorage.getItem('esb-theme');
if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
/* ===== 素雅温暖 — cream / warm-brown / terracotta ===== */
:root,[data-theme="light"]{
  --bg:#EFE9DB;--paper:#FCFAF4;--paper-2:#F4EEE1;--ink:#36302A;--ink-soft:#6B6155;--ink-faint:#A0937F;
  --line:#E0D5C2;--accent:#B5523A;--accent-soft:#C8714F;--accent-bg:#F3E1D6;
  --brown:#8A6D4F;--gold:#B0842B;--ok:#5C7A4A;
  --code-bg:#F0E8D8;--shadow:0 1px 2px rgba(58,40,22,.05),0 5px 18px -12px rgba(58,40,22,.2);
}
[data-theme="dark"]{
  --bg:#1E1A15;--paper:#27221C;--paper-2:#2E2820;--ink:#ECE4D6;--ink-soft:#B7AB97;--ink-faint:#80755f;
  --line:#39322A;--accent:#E08763;--accent-soft:#C8714F;--accent-bg:#39291F;
  --brown:#C2A079;--gold:#D7AE54;--ok:#9CB57F;
  --code-bg:#322B22;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:13px;line-height:1.5;transition:background .3s,color .3s}
.serif{font-family:Georgia,"Songti SC","Source Han Serif SC","Times New Roman",serif}
/* toolbar (screen only) */
.toolbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 18px}
.toolbar .t{flex:1;font-family:Georgia,"Songti SC",serif;font-weight:700;font-size:1.05rem}
.toolbar .t b{color:var(--accent)}
.tbtn{border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:9px;
  padding:8px 14px;font-size:.85rem;cursor:pointer;font-family:inherit;transition:.15s;font-weight:600}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.print{background:var(--accent);color:#fff;border-color:var(--accent)}
.tbtn.print:hover{filter:brightness(1.06);color:#fff}
/* page = A4 canvas on screen */
.page{width:210mm;max-width:100%;min-height:297mm;margin:18px auto;background:var(--paper);
  box-shadow:0 6px 30px -10px rgba(0,0,0,.3);padding:12mm 11mm;border-radius:2px}
.head{border-bottom:3px double var(--accent);padding-bottom:8px;margin-bottom:12px;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h1{font-family:Georgia,"Songti SC",serif;font-size:1.7rem;margin:0;line-height:1.1}
.head h1 .ac{color:var(--accent);font-style:italic}
.head .meta{margin-left:auto;font-size:.74rem;color:var(--ink-faint);letter-spacing:.5px;text-transform:uppercase}
/* 3-column dense layout */
.sheet{column-count:3;column-gap:9px;column-fill:balance}
.cardx{break-inside:avoid;-webkit-column-break-inside:avoid;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px 9px;margin:0 0 9px;box-shadow:var(--shadow)}
.cardx h2{font-size:.86rem;margin:0 0 6px;padding:0 0 4px 8px;position:relative;color:var(--ink);
  border-bottom:1px solid var(--line);letter-spacing:.2px}
.cardx h2::before{content:"";position:absolute;left:0;top:1px;bottom:5px;width:3px;border-radius:2px;background:var(--accent)}
.cardx.c2 h2::before{background:var(--brown)} .cardx.c3 h2::before{background:var(--gold)} .cardx.c4 h2::before{background:var(--ok)}
.cardx p{margin:5px 0}
.cardx ul,.cardx ol{margin:5px 0;padding-left:16px}
.cardx li{margin:2px 0}
.cardx li::marker{color:var(--accent)}
.cardx b,.cardx strong{color:var(--ink)}
.kv{display:flex;gap:6px;margin:3px 0;font-size:.82rem}
.kv .k{flex:0 0 auto;font-weight:700;color:var(--accent)}
table{width:100%;border-collapse:collapse;margin:5px 0;font-size:.78rem}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
thead th{background:var(--paper-2);font-weight:700;border-bottom:1px solid var(--brown)}
tbody tr:last-child td{border-bottom:none}
code,kbd{font-family:"Cascadia Code","Consolas","Roboto Mono",monospace;font-size:.82em;
  background:var(--code-bg);padding:.05em .35em;border-radius:4px;color:var(--accent)}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin:5px 0;
  font-family:"Cascadia Code","Consolas",monospace;font-size:.76rem;line-height:1.45;overflow-x:auto;white-space:pre-wrap}
pre code{background:none;padding:0;color:var(--ink)}
.pill{display:inline-block;background:var(--accent-bg);color:var(--accent);font-size:.68rem;font-weight:700;
  padding:1px 7px;border-radius:999px;margin:0 3px 3px 0}
.hl{background:linear-gradient(transparent 55%,var(--accent-bg) 55%);padding:0 1px}
.foot{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:.7rem;color:var(--ink-faint);
  display:flex;justify-content:space-between}
/* responsive (screen) */
@media(max-width:820px){.sheet{column-count:2}.page{padding:8mm}}
@media(max-width:520px){.sheet{column-count:1}.head .meta{margin-left:0}}
/* ===== PRINT — A4, force light, hide chrome ===== */
@page{size:A4;margin:9mm}
@media print{
  :root,[data-theme="dark"]{
    --bg:#fff;--paper:#fff;--paper-2:#f3eee2;--ink:#1f1b16;--ink-soft:#43403a;--ink-faint:#7a7363;
    --line:#c9bda6;--accent:#9c3f2a;--accent-bg:#f0e2d8;--brown:#7a5f43;--gold:#946d1f;--ok:#4d6a3c;--code-bg:#f1ead9;
  }
  body{background:#fff;font-size:8.6pt;line-height:1.32}
  .toolbar{display:none}
  .page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;border-radius:0}
  .sheet{column-count:3;column-gap:5mm}
  .cardx{box-shadow:none;border:1px solid var(--line);padding:5px 7px 5px;margin:0 0 5px;border-radius:5px}
  .cardx h2{font-size:8.8pt}
  .head h1{font-size:15pt}
  pre,code,kbd{font-size:7.4pt}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<div class="toolbar">
  <div class="t">考点<b>小抄</b> · A4 Cheat Sheet</div>
  <button class="tbtn" id="themeBtn">&#127769; 主题</button>
  <button class="tbtn print" id="printBtn">&#128424; 打印 / Print</button>
</div>

<div class="page">
  <div class="head">
    <h1 class="serif">考点<span class="ac">速记</span>小抄</h1>
    <span class="meta">EXAM SPRINT · ONE-PAGE CHEAT SHEET</span>
  </div>
  <div class="sheet" id="sheet">
<!--__SECTIONS__-->
  </div>
  <div class="foot"><span>素雅温暖 · 离线小抄模板</span><span id="footRight">A4 · 3-column</span></div>
</div>

<script>
const THEME_KEY='esb-theme';
const $=s=>document.querySelector(s);

/* ===== Demo sections when content is empty ===== */
function demoSections(){
  return [
'<div class="cardx"><h2>① 占位说明</h2><p>内容为空时显示演示卡片。把小抄分节注入 <code>&lt;!--__SECTIONS__--&gt;</code>。</p>',
'<p>每节用 <code>&lt;div class="cardx"&gt;</code> 包裹，<code>&lt;h2&gt;</code> 作小标题，卡片不会被分栏截断。</p></div>',
'<div class="cardx c2"><h2>② 速查表</h2><table><thead><tr><th>键</th><th>值</th></tr></thead><tbody>',
'<tr><td>主题键</td><td><code>esb-theme</code></td></tr><tr><td>占位</td><td><code>__SECTIONS__</code></td></tr>',
'<tr><td>版式</td><td>A4 · 三栏</td></tr></tbody></table></div>',
'<div class="cardx c3"><h2>③ 要点清单</h2><ul><li>密排卡片，<b>break-inside:avoid</b> 防截断</li>',
'<li>打印时强制浅色、隐藏工具栏</li><li><span class="hl">高亮</span> 与 <span class="pill">标签</span> 可用</li></ul></div>',
'<div class="cardx c4"><h2>④ 代码片段</h2><pre><code>// 打印：Ctrl/Cmd + P\nwindow.print();</code></pre>',
'<div class="kv"><span class="k">提示</span><span>屏幕明暗双主题，纸面恒为浅色省墨。</span></div></div>',
'<div class="cardx"><h2>⑤ 公式 / 定义</h2><p><b>定义：</b>一句话核心。</p><div class="kv"><span class="k">公式</span><span><code>y = f(x)</code></span></div>',
'<div class="kv"><span class="k">单位</span><span>SI</span></div></div>',
'<div class="cardx c2"><h2>⑥ 易错点</h2><ol><li>边界条件别漏</li><li>单位换算</li><li>符号方向</li></ol></div>'
  ].join('');
}

/* ===== Theme ===== */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);
  $('#themeBtn').innerHTML=t==='dark'?'☀️ 主题':'\u{1F319} 主题';try{localStorage.setItem(THEME_KEY,t);}catch(e){}}
$('#themeBtn').onclick=()=>applyTheme((document.documentElement.getAttribute('data-theme')||'light')==='dark'?'light':'dark');
$('#printBtn').onclick=()=>window.print();

/* ===== Boot ===== */
(function(){
  const sheet=$('#sheet');
  if(sheet.children.length===0){sheet.innerHTML=demoSections();}
  const n=sheet.querySelectorAll('.cardx').length;
  $('#footRight').textContent='A4 · 3-column · '+n+' 节';
  applyTheme(document.documentElement.getAttribute('data-theme')||'light');
})();
</script>
</body>
</html>
